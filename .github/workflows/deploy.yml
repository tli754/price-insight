name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (commit SHA or "latest")'
        required: false
        default: 'latest'
      target:
        description: 'Which service to deploy'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
          - gateway

env:
  GKE_PROJECT: wd-tools
  GKE_CLUSTER: wd-tools-medium
  GKE_ZONE: australia-southeast1-a
  BACKEND_IMAGE: australia-southeast1-docker.pkg.dev/wd-tools/price-insight/price-insight-backend
  FRONTEND_IMAGE: australia-southeast1-docker.pkg.dev/wd-tools/price-insight/price-insight-frontend
  GATEWAY_IMAGE: australia-southeast1-docker.pkg.dev/wd-tools/price-insight/price-insight-gateway

jobs:
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/920312412888/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: price-insight-ci@wd-tools.iam.gserviceaccount.com

      - name: Set up gcloud + kubectl
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project wd-tools

      - name: Apply base manifests
        run: kubectl apply -f k8s/ --recursive

      - name: Sync secrets
        run: |
          PROJECT=wd-tools

          MYSQL_HOST=$(gcloud secrets versions access latest --secret="backend-mysql-host" --project="$PROJECT")
          MYSQL_USER=$(gcloud secrets versions access latest --secret="backend-mysql-user" --project="$PROJECT")
          MYSQL_PASSWORD=$(gcloud secrets versions access latest --secret="backend-mysql-password" --project="$PROJECT")
          MYSQL_DATABASE=$(gcloud secrets versions access latest --secret="backend-mysql-database" --project="$PROJECT")
          OPENAI_API_KEY=$(gcloud secrets versions access latest --secret="backend-openai-api-key" --project="$PROJECT")
          OPENAI_MODEL=$(gcloud secrets versions access latest --secret="backend-openai-model" --project="$PROJECT")
          JINA_API_KEY=$(gcloud secrets versions access latest --secret="backend-jina-api-key" --project="$PROJECT")
          SERPAPI_API_KEY=$(gcloud secrets versions access latest --secret="backend-serpapi-api-key" --project="$PROJECT")
          DATAFORSEO_LOGIN=$(gcloud secrets versions access latest --secret="backend-dataforseo-login" --project="$PROJECT")
          DATAFORSEO_PASSWORD=$(gcloud secrets versions access latest --secret="backend-dataforseo-password" --project="$PROJECT")
          SHOPIFY_TOKEN_URL=$(gcloud secrets versions access latest --secret="backend-shopify-token-url" --project="$PROJECT" 2>/dev/null || echo "")
          SHOPIFY_PRODUCTS_URL=$(gcloud secrets versions access latest --secret="backend-shopify-products-url" --project="$PROJECT" 2>/dev/null || echo "")
          SHOPIFY_ORDERS_URL=$(gcloud secrets versions access latest --secret="backend-shopify-orders-url" --project="$PROJECT" 2>/dev/null || echo "")
          SHOPIFY_CLIENT_ID=$(gcloud secrets versions access latest --secret="backend-shopify-client-id" --project="$PROJECT" 2>/dev/null || echo "")
          SHOPIFY_CLIENT_SECRET=$(gcloud secrets versions access latest --secret="backend-shopify-client-secret" --project="$PROJECT" 2>/dev/null || echo "")
          OWN_STORE_NAME=$(gcloud secrets versions access latest --secret="backend-own-store-name" --project="$PROJECT" 2>/dev/null || echo "")

          kubectl create secret generic backend-secrets \
            --namespace=price-insight \
            --from-literal=MYSQL_HOST="$MYSQL_HOST" \
            --from-literal=MYSQL_PORT="3306" \
            --from-literal=MYSQL_USER="$MYSQL_USER" \
            --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            --from-literal=MYSQL_DATABASE="$MYSQL_DATABASE" \
            --from-literal=REDIS_HOST="redis" \
            --from-literal=REDIS_PORT="6379" \
            --from-literal=REDIS_TTL_SECONDS="86400" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=OPENAI_MODEL="$OPENAI_MODEL" \
            --from-literal=JINA_API_KEY="$JINA_API_KEY" \
            --from-literal=SERPAPI_API_KEY="$SERPAPI_API_KEY" \
            --from-literal=DATAFORSEO_LOGIN="$DATAFORSEO_LOGIN" \
            --from-literal=DATAFORSEO_PASSWORD="$DATAFORSEO_PASSWORD" \
            --from-literal=SHOPIFY_TOKEN_URL="$SHOPIFY_TOKEN_URL" \
            --from-literal=SHOPIFY_PRODUCTS_URL="$SHOPIFY_PRODUCTS_URL" \
            --from-literal=SHOPIFY_ORDERS_URL="$SHOPIFY_ORDERS_URL" \
            --from-literal=SHOPIFY_CLIENT_ID="$SHOPIFY_CLIENT_ID" \
            --from-literal=SHOPIFY_CLIENT_SECRET="$SHOPIFY_CLIENT_SECRET" \
            --from-literal=OWN_STORE_NAME="$OWN_STORE_NAME" \
            --dry-run=client -o yaml | kubectl apply -f -

          NUXT_SESSION_PASSWORD=$(gcloud secrets versions access latest --secret="frontend-nuxt-session-password" --project="$PROJECT")
          NUXT_DEV_AUTH_PASSWORD=$(gcloud secrets versions access latest --secret="frontend-nuxt-dev-auth-password" --project="$PROJECT")
          NUXT_API_URL=$(gcloud secrets versions access latest --secret="frontend-nuxt-api-url" --project="$PROJECT")

          kubectl create secret generic frontend-secrets \
            --namespace=price-insight \
            --from-literal=NUXT_SESSION_PASSWORD="$NUXT_SESSION_PASSWORD" \
            --from-literal=NUXT_API_URL="$NUXT_API_URL" \
            --from-literal=NUXT_DEV_AUTH_PASSWORD="$NUXT_DEV_AUTH_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          GATEWAY_SESSION_SECRET=$(gcloud secrets versions access latest --secret="gateway-session-secret" --project="$PROJECT")
          GATEWAY_DEV_AUTH_PASSWORD=$(gcloud secrets versions access latest --secret="gateway-dev-auth-password" --project="$PROJECT")

          kubectl create secret generic gateway-secrets \
            --namespace=price-insight \
            --from-literal=SESSION_SECRET="$GATEWAY_SESSION_SECRET" \
            --from-literal=DEV_AUTH_PASSWORD="$GATEWAY_DEV_AUTH_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run database migrations
        if: inputs.target == 'all' || inputs.target == 'backend'
        run: |
          kubectl delete job db-migrate --ignore-not-found -n price-insight

          export BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ inputs.image_tag }}
          envsubst < .github/k8s/migration-job.yaml | kubectl apply -f -

          if ! kubectl wait --for=condition=complete job/db-migrate \
              -n price-insight --timeout=120s; then
            echo "--- Migration logs ---"
            kubectl logs -l job-name=db-migrate -n price-insight --tail=100
            exit 1
          fi

      - name: Roll out backend
        if: inputs.target == 'all' || inputs.target == 'backend'
        run: |
          kubectl set image deployment/backend \
            backend=${{ env.BACKEND_IMAGE }}:${{ inputs.image_tag }} \
            -n price-insight
          kubectl rollout status deployment/backend -n price-insight --timeout=120s

      - name: Roll out frontend
        if: inputs.target == 'all' || inputs.target == 'frontend'
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ inputs.image_tag }} \
            -n price-insight
          kubectl rollout status deployment/frontend -n price-insight --timeout=120s

      - name: Roll out gateway
        if: inputs.target == 'all' || inputs.target == 'gateway'
        run: |
          kubectl set image deployment/gateway \
            gateway=${{ env.GATEWAY_IMAGE }}:${{ inputs.image_tag }} \
            -n price-insight
          kubectl rollout status deployment/gateway -n price-insight --timeout=120s
