apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: price-insight
  annotations:
    # Each deploy generates a new job by deleting the old one first:
    # kubectl delete job db-migrate -n price-insight --ignore-not-found
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: price-insight-ksa
      restartPolicy: Never
      containers:
        - name: migrate
#          image: australia-southeast1-docker.pkg.dev/wd-tools/price-insight/price-insight-backend:IMAGE_TAG
          image: australia-southeast1-docker.pkg.dev/wd-tools/price-insight/price-insight-backend:latest
          command: ["npx", "drizzle-kit", "push"]
          envFrom:
            - secretRef:
                name: backend-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: MYSQL_HOST
              value: "127.0.0.1"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
          args:
            - "--structured-logs"
            - "--port=3306"
            - "wd-tools:australia-southeast1:wd-tools-dev"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
