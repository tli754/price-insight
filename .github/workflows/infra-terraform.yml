name: Terraform Infrastructure

# Manual-only trigger. Run plan first; apply requires explicit action input.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} (prod)
    runs-on: ubuntu-latest

    # GitHub Environment enables required-reviewer protection before apply.
    environment: prod

    permissions:
      contents: read
      id-token: write

    env:
      TF_DIR: infra/terraform/environments/prod
      # Pass tfvars inline so no untracked tfvars file is needed in CI.
      TF_VAR_project_id: wd-tools
      TF_VAR_region: australia-southeast1

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # WIF provider — same pool used by deploy.yml.
          # Value: projects/920312412888/locations/global/workloadIdentityPools/github-actions/providers/github
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          # Dedicated Terraform service account (may differ from app CI SA).
          service_account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.6'

      - name: Terraform fmt check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -out=tfplan

      - name: Export readable plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod-${{ github.run_id }}
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/tfplan.txt
          retention-days: 7

      - name: Terraform apply
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply tfplan
