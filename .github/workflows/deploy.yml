name: Build and Deploy

on:
  push:
    branches: [master]

env:
  GAR_REGION: australia-southeast1
  GKE_PROJECT: wd-tools
  GKE_CLUSTER: wd-tools-cluster
  GKE_REGION: australia-southeast1
  GAR_REPO: price-insight
  BACKEND_IMAGE: australia-southeast1-docker.pkg.dev/wd-tools/price-insight/price-insight-backend
  FRONTEND_IMAGE: australia-southeast1-docker.pkg.dev/wd-tools/price-insight/price-insight-frontend

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev --quiet

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:latest
          cache-to: type=inline

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev --quiet

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:latest
          cache-to: type=inline

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud + kubectl
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials wd-tools-cluster \
            --region australia-southeast1 \
            --project wd-tools

      - name: Apply base manifests
        run: kubectl apply -f k8s/ --recursive

      - name: Sync secrets
        run: |
          kubectl create secret generic backend-secrets \
            --namespace=price-insight \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=MYSQL_HOST="127.0.0.1" \
            --from-literal=MYSQL_PORT="3306" \
            --from-literal=MYSQL_USER="${{ secrets.MYSQL_USER }}" \
            --from-literal=MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --from-literal=MYSQL_DATABASE="${{ secrets.MYSQL_DATABASE }}" \
            --from-literal=REDIS_HOST="redis" \
            --from-literal=REDIS_PORT="6379" \
            --from-literal=REDIS_TTL_SECONDS="86400" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=OPENAI_MODEL="${{ secrets.OPENAI_MODEL }}" \
            --from-literal=JINA_API_KEY="${{ secrets.JINA_API_KEY }}" \
            --from-literal=SERPAPI_API_KEY="${{ secrets.SERPAPI_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic frontend-secrets \
            --namespace=price-insight \
            --from-literal=NUXT_SESSION_PASSWORD="${{ secrets.NUXT_SESSION_PASSWORD }}" \
            --from-literal=NUXT_OAUTH_GOOGLE_CLIENT_ID="${{ secrets.NUXT_OAUTH_GOOGLE_CLIENT_ID }}" \
            --from-literal=NUXT_OAUTH_GOOGLE_CLIENT_SECRET="${{ secrets.NUXT_OAUTH_GOOGLE_CLIENT_SECRET }}" \
            --from-literal=NUXT_PUBLIC_API_URL="https://qweyha520.bar" \
            --from-literal=NUXT_DEV_AUTH_BYPASS="${{ secrets.NUXT_DEV_AUTH_BYPASS }}" \
            --from-literal=NUXT_DEV_AUTH_PASSWORD="${{ secrets.NUXT_DEV_AUTH_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run database migrations
        continue-on-error: true
        run: |
          kubectl delete job db-migrate -n price-insight --ignore-not-found
          sed "s|IMAGE_TAG|${{ github.sha }}|g" k8s/backend/migration-job.yaml \
            | kubectl apply -f -
          kubectl wait --for=condition=complete \
            --timeout=180s job/db-migrate \
            -n price-insight

      - name: Roll out new images
        run: |
          kubectl set image deployment/backend \
            backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -n price-insight
          kubectl set image deployment/frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -n price-insight
          kubectl rollout status deployment/backend -n price-insight --timeout=120s
          kubectl rollout status deployment/frontend -n price-insight --timeout=120s
