name: Deploy to Cloud Run

# Routine image releases for Cloud Run. Terraform (infra-terraform.yml) owns
# service shape, IAM, scaling, env/secret wiring, Cloud SQL attachment, and
# routing — this workflow only ever updates the running image, pinned by
# digest (never `latest` or any mutable tag), with a smoke test + rollback.
# order-worker is intentionally not deployed here — its code/packaging is an
# open PR 4 decision.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which service to deploy'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend

env:
  GAR_REGION: australia-southeast1
  RUN_REGION: australia-southeast1
  PROJECT_ID: wd-tools
  BACKEND_IMAGE: australia-southeast1-docker.pkg.dev/wd-tools/price-insight/price-insight-backend
  FRONTEND_IMAGE: australia-southeast1-docker.pkg.dev/wd-tools/price-insight/price-insight-frontend

jobs:
  deploy-backend:
    name: Deploy Backend
    if: inputs.target == 'all' || inputs.target == 'backend'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/920312412888/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: price-insight-ci@wd-tools.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend image (SHA-tagged, immutable)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Record current revision (for rollback)
        id: previous
        run: |
          PREV=$(gcloud run services describe backend \
            --region="${{ env.RUN_REGION }}" --project="${{ env.PROJECT_ID }}" \
            --format='value(status.traffic[0].revisionName)')
          echo "revision=$PREV" >> "$GITHUB_OUTPUT"

      - name: Deploy by digest
        run: |
          gcloud run deploy backend \
            --image="${{ env.BACKEND_IMAGE }}@${{ steps.build.outputs.digest }}" \
            --region="${{ env.RUN_REGION }}" --project="${{ env.PROJECT_ID }}"

      - name: Smoke test
        id: smoke
        continue-on-error: true
        run: |
          URL=$(gcloud run services describe backend \
            --region="${{ env.RUN_REGION }}" --project="${{ env.PROJECT_ID }}" \
            --format='value(status.url)')
          curl -sf "$URL/api/health" --max-time 10

      - name: Roll back on smoke test failure
        if: steps.smoke.outcome == 'failure'
        run: |
          gcloud run services update-traffic backend \
            --region="${{ env.RUN_REGION }}" --project="${{ env.PROJECT_ID }}" \
            --to-revisions="${{ steps.previous.outputs.revision }}=100"

      - name: Fail job if smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke test failed — rolled back to ${{ steps.previous.outputs.revision }}"
          exit 1

  deploy-frontend:
    name: Deploy Frontend
    if: inputs.target == 'all' || inputs.target == 'frontend'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/920312412888/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: price-insight-ci@wd-tools.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_REGION }}-docker.pkg.dev --quiet

      - name: Resolve backend URL (build-time proxy target)
        id: backend_url
        run: |
          URL=$(gcloud run services describe backend \
            --region="${{ env.RUN_REGION }}" --project="${{ env.PROJECT_ID }}" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image (SHA-tagged, immutable)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NUXT_BACKEND_URL=${{ steps.backend_url.outputs.url }}

      - name: Record current revision (for rollback)
        id: previous
        run: |
          PREV=$(gcloud run services describe frontend \
            --region="${{ env.RUN_REGION }}" --project="${{ env.PROJECT_ID }}" \
            --format='value(status.traffic[0].revisionName)')
          echo "revision=$PREV" >> "$GITHUB_OUTPUT"

      - name: Deploy by digest
        run: |
          gcloud run deploy frontend \
            --image="${{ env.FRONTEND_IMAGE }}@${{ steps.build.outputs.digest }}" \
            --region="${{ env.RUN_REGION }}" --project="${{ env.PROJECT_ID }}"

      - name: Smoke test
        id: smoke
        continue-on-error: true
        run: |
          URL=$(gcloud run services describe frontend \
            --region="${{ env.RUN_REGION }}" --project="${{ env.PROJECT_ID }}" \
            --format='value(status.url)')

          BODY=$(curl -sf "$URL/api/health" --max-time 10)
          if echo "$BODY" | grep -qi "successfully deployed a container image to Cloud Run"; then
            echo "Frontend is still serving the Cloud Run bootstrap placeholder, not the real app"
            exit 1
          fi

          ACTIVE_REVISION=$(gcloud run services describe frontend \
            --region="${{ env.RUN_REGION }}" --project="${{ env.PROJECT_ID }}" \
            --format='value(status.traffic[0].revisionName)')
          ACTIVE_IMAGE=$(gcloud run revisions describe "$ACTIVE_REVISION" \
            --region="${{ env.RUN_REGION }}" --project="${{ env.PROJECT_ID }}" \
            --format='value(spec.containers[0].image)')
          if [[ "$ACTIVE_IMAGE" == *"cloudrun/container/hello"* ]]; then
            echo "Active revision $ACTIVE_REVISION is still the bootstrap placeholder image ($ACTIVE_IMAGE)"
            exit 1
          fi

      - name: Roll back on smoke test failure
        if: steps.smoke.outcome == 'failure'
        run: |
          gcloud run services update-traffic frontend \
            --region="${{ env.RUN_REGION }}" --project="${{ env.PROJECT_ID }}" \
            --to-revisions="${{ steps.previous.outputs.revision }}=100"

      - name: Fail job if smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke test failed — rolled back to ${{ steps.previous.outputs.revision }}"
          exit 1
