apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: price-insight
  namespace: price-insight
spec:
  ingressClassName: nginx
  rules:
    - host: www.qweyha520.bar
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
---
# Permanent redirect: qweyha520.bar → www.qweyha520.bar
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: price-insight-www-redirect
  namespace: price-insight
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: "https://www.qweyha520.bar/"
spec:
  ingressClassName: nginx
  rules:
    - host: qweyha520.bar
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
