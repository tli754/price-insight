name: Codex Review

# Triggered manually from the PR page by adding the "ai-review" label — not a
# general workflow_dispatch entry, so it doesn't clutter the Actions menu.
# Re-run by removing and re-adding the label (no auto-removal after review).
on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  codex-review:
    if: github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    steps:
      # Pinned to the merge ref and read-only, with no persisted credentials —
      # this runs against untrusted fork-PR content with base-repo secrets
      # available, so it must never execute PR code with write access.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Run Codex review
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          prompt: |
            Review this PR for:
            - architecture consistency
            - TypeScript issues
            - security
            - performance
            - missing tests

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_BODY: ${{ steps.codex.outputs.final-message }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "$REVIEW_BODY"
