apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: price-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Image is updated by CI: kubectl set image deployment/frontend frontend=<image>:<sha>
          image: australia-southeast1-docker.pkg.dev/wd-tools/price-insight/price-insight-frontend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: frontend-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: NUXT_OAUTH_GOOGLE_REDIRECT_URL
              value: "https://www.qweyha520.bar/auth/google"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
