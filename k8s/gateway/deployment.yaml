apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: price-insight
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          # Image is updated by CI: kubectl set image deployment/gateway gateway=<image>:<sha>
          image: australia-southeast1-docker.pkg.dev/wd-tools/price-insight/price-insight-gateway:latest
          ports:
            - containerPort: 4001
          envFrom:
            - secretRef:
                name: gateway-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4001"
            - name: BACKEND_URL
              value: "http://backend.price-insight.svc.cluster.local:4000"
            - name: FRONTEND_URL
              value: "https://www.qweyha520.bar"
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
